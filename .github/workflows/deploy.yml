name: Deploy to EC2

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        id: run_tests
        run: npm test

      - name: Email on test failure
        if: failure() && steps.run_tests.outcome == 'failure'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Deployment blocked: tests failed on ${{ github.repository }}"
          to: dvirlh1@gmail.com
          from: "Portfolio Bot CI <${{ secrets.MAIL_USERNAME }}>"
          body: |
            Tests failed for commit ${{ github.sha }} on branch ${{ github.ref_name }}, so the deployment to EC2 was skipped.

            Commit: ${{ github.event.head_commit.message }}
            Author: ${{ github.event.head_commit.author.name }}
            Run logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ec2-user/portfolio-bot-server
            pwd
            ls -la
            git fetch origin
            git reset --hard origin/main

            npm ci

            pm2 restart ecosystem.config.cjs --env production
            pm2 save
